version: '3.8'

services:
  # 1. MySQL 8 Database
  db:
    image: mysql:8.0
    container_name: tenderhub_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tenderhub_root_secure_pass_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tenderhub_prod}
      MYSQL_USER: ${MYSQL_USER:-tenderhub_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tenderhub_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tenderhub_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. CodeIgniter 4.7.4 (PHP 8.3-FPM API)
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: tenderhub_api
    restart: unless-stopped
    environment:
      CI_ENVIRONMENT: production
      database.default.hostname: db
      database.default.database: ${MYSQL_DATABASE:-tenderhub_prod}
      database.default.username: ${MYSQL_USER:-tenderhub_user}
      database.default.password: ${MYSQL_PASSWORD:-tenderhub_pass_2026}
      database.default.DBDriver: MySQLi
    volumes:
      - ./apps/api/writable:/var/www/html/writable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tenderhub_net

  # 3. Next.js 16 Web Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: tenderhub_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://tenderhub.lk/api/v1
    networks:
      - tenderhub_net

  # 4. Nginx Reverse Proxy & SSL Termination
  nginx:
    image: nginx:alpine
    container_name: tenderhub_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/tenderhub.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api/public:/var/www/html/public:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
    depends_on:
      - api
      - web
    networks:
      - tenderhub_net

networks:
  tenderhub_net:
    driver: bridge

volumes:
  mysql_data:
  certbot_etc:
  certbot_var:
