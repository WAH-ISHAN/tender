# TenderHub Nginx Reverse Proxy Configuration

# 1. HTTP to HTTPS redirect
server {
    listen 80;
    server_name tenderhub.lk www.tenderhub.lk;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server
server {
    listen 443 ssl http2;
    server_name tenderhub.lk www.tenderhub.lk;

    # SSL Certificate directives (Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/tenderhub.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tenderhub.lk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload limit for tender PDF attachments
    client_max_body_size 35M;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API Backend (CodeIgniter 4 PHP 8.3-FPM)
    location /api/ {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php$is_args$args;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass api:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param CI_ENVIRONMENT production;
        }
    }

    # Next.js 16 Web Frontend (Port 3000)
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
